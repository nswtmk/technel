<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technel</title>
<style>
  :root {
    --paper: #faf9f5;
    --ink: #14140f;
    --ink-soft: #4a4a42;
    --line: #d9d7cd;
    --moss: #0ca568;
    --mint: #1de394;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", Arial, sans-serif;
    font-feature-settings: "palt";
    -webkit-font-smoothing: antialiased;
    max-width: 760px; margin: 0 auto; padding: 72px 24px;
  }
  .kicker { font-size: 12px; letter-spacing: .3em; color: var(--moss); font-weight: 600; text-transform: uppercase; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: .04em; margin-top: 14px; }
  .lead { font-size: 15px; line-height: 2; color: var(--ink-soft); margin-top: 14px; }
  ul { list-style: none; margin-top: 48px; border-top: 1px solid var(--line); }
  li a {
    display: block; padding: 22px 4px; border-bottom: 1px solid var(--line);
    color: var(--ink); text-decoration: none; transition: background .15s;
  }
  li a:hover { background: #f3f2ea; }
  li .t { font-size: 19px; font-weight: 700; }
  li .d { font-size: 13.5px; color: var(--ink-soft); margin-top: 6px; line-height: 1.8; }
  li .d .tag { color: var(--moss); font-weight: 600; }
  footer { margin-top: 56px; font-size: 12px; letter-spacing: .14em; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="kicker">Technel</div>
  <h1>七沢智樹｜資料置き場</h1>
  <p class="lead">Technel合同会社。技術哲学のレクチャー資料・プロジェクトのアーカイブ。</p>
  <ul>
    <li>
      <a href="nttdata-lecture/">
        <div class="t">技術と人間の関係は、どうしたら見えるようになるのか</div>
        <div class="d"><span class="tag">LECTURE</span>　NTTデータ「AIと倫理」ゼミ 有識者レクチャー①｜2026.08.26</div>
      </a>
    </li>
    <li>
      <a href="ondoku/">
        <div class="t">音読装置</div>
        <div class="d"><span class="tag">TOOL</span>　原稿を声に出して聞き、引っかかった文に朱を入れる。ホーム画面に置け、電波がなくても開く</div>
      </a>
    </li>
  </ul>
  <footer>© Technel LLC</footer>
</body>
</html>
